:root[data-theme="dark"]{--tx:#f3e8f8;--mu:#bba5cb;--pri:#c79be0;--pu:#D7BDE2;--pub:rgba(215,189,226,.2);--gl:rgba(62,38,84,.6);--gb:rgba(255,255,255,.1);--nob:rgba(215,189,226,.12);--bd:rgba(215,189,226,.22);--bg:radial-gradient(at 12% 8%,#5a3375,transparent 50%),radial-gradient(at 88% 18%,#6b3b86,transparent 45%),radial-gradient(at 50% 95%,#3a2c6b,transparent 50%),#1f1230}

.seg{display:flex;gap:6px;flex-shrink:0}.seg button{width:46px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--gl);color:var(--mu);font:700 17px inherit;font-family:inherit}

function load(){
 if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(function(d){D=d;S.err='';build();render()}).withFailureHandler(function(e){S.err=(e&&e.message)||'โหลดข้อมูลไม่สำเร็จ';render()}).apiData()}

}
function build(){
 TD=dk(Date.now());R=D.rows;BY={};
 R.forEach(function(r){(BY[r.pk]=BY[r.pk]||[]).push(r)});
 var im={};
 R.forEach(function(r){if(!r.ok)r.it.forEach(function(it){var k=r.pk+'|'+it.toLowerCase(),o=im[k];if(!o)o=im[k]={k:k,pk:r.pk,p:r.p,br:r.br,dp:r.dp,it:it,first:r.t,last:r.t,n:0,dt:''};o.n++;o.last=r.t;o.br=r.br;if(r.dt)o.dt=r.dt})});

 var cut=Date.now()-30*864e5,fm={};FLEET=[];OIL=[];
 (D.veh||[]).forEach(function(v){var k=pkey(v.p);if(v.on)fm[k]={pk:k,p:v.p,br:v.br||'',ty:v.ty||'',code:v.code||'',desc:v.desc||'',note:v.note||''}});
 Object.keys(BY).forEach(function(pk){var a=BY[pk],L=a[a.length-1];if(L.t>=cut||fm[pk]){var o=fm[pk]||(fm[pk]={pk:pk,p:L.p});o.br=o.br||L.br||'';o.ty=o.ty||tyOf(L.ty)}});
 Object.keys(fm).forEach(function(k){FLEET.push(fm[k])});
 Object.keys(BY).forEach(function(pk){var a=BY[pk],L=a[a.length-1];if(L.t<cut)return;
  if(/ยก/.test(L.ty))return;var km=null,nx=null;for(var i=a.length-1;i>=0&&(km==null||nx==null);i--){if(km==null&&a[i].km)km=a[i].km;if(nx==null&&a[i].nx)nx=a[i].nx}
  if(km&&nx)OIL.push({pk:pk,p:L.p,br:L.br,km:km,nx:nx,diff:nx-km})});

}
function brs(){var s={};R.forEach(function(r){if(r.br)s[r.br]=1});return Object.keys(s).sort()}
function pill(t,c){return"<span class='pill "+c+"'>"+t+"</span>"}
function dash(){
 var now=Date.now(),P=S.P,br=S.br,span=P*864e5;
 var rows=R.filter(function(r){return(!br||r.br==br)&&(!P||now-r.t<=span)});
 var fleet=FLEET.filter(function(f){return!br||f.br==br}),rep={};R.forEach(function(r){if(r.d==TD)rep[r.pk]=1});
 var miss=fleet.filter(function(f){return!rep[f.pk]}),dn=fleet.length-miss.length,pc=fleet.length?Math.round(dn/fleet.length*100):0;
 var open=ISS.filter(function(i){return i.open&&(!br||i.br==br)}),urg=open.filter(function(i){return i.urg});
 var oil=OIL.filter(function(o){return!br||o.br==br}),ov=oil.filter(function(o){return o.diff<=0});
 var fl=rows.filter(function(r){return r.fl&&r.fl.length}).length;
 var N=P||30,d0=Date.now(),v=[],ix={};for(var i=0;i<N;i++){v.push(0);ix[dk(d0-(N-1-i)*864e5)]=i}
 R.forEach(function(r){if(br&&r.br!=br)return;var k=ix[r.d];if(k!==undefined)v[k]++});
 var okN=rows.filter(function(r){return r.ok}).length,bad=rows.length-okN,ic={};
 rows.forEach(function(r){if(!r.ok)r.it.forEach(function(x){ic[x]=(ic[x]||0)+1})});
 var ti=Object.keys(ic).sort(function(a,b){return ic[b]-ic[a]}).slice(0,7),mx=ic[ti[0]]||1;

 var rows=R.filter(function(r){return set[r.pk]&&r.d>=rg.from&&r.d<=rg.to}),by={},top={};

 var checked=Object.keys(by).map(function(pk){var rs=by[pk],items={},L=rs[rs.length-1];rs.forEach(function(r){if(!r.ok)r.it.forEach(function(x){items[x]=(items[x]||0)+1;top[x]=(top[x]||0)+1})});return{pk:pk,p:L.p,last:L,items:Object.keys(items),n:rs.length}});
 checked.sort(function(a,b){return b.last.t-a.last.t});
 var probs=checked.filter(function(c){return c.items.length}),miss=fl.filter(function(x){return!by[x.pk]});
 var tk=Object.keys(top).sort(function(a,b){return top[b]-top[a]}).slice(0,5).map(function(k){return k+' ×'+top[k]}),pc=fl.length?Math.round(checked.length/fl.length*100):0;
 var pcount=probs.reduce(function(s,c){return s+c.items.length},0);
 var tx='สรุปการตรวจรถ'+PN[per]+' '+rg.label+'\nแผนก: '+(unit||'ทั้งหมด')+'\nตรวจแล้ว '+checked.length+'/'+fl.length+' คัน ('+pc+'%)\nพบปัญหา '+probs.length+' คัน ('+pcount+' รายการ)'+probs.map(function(c){return'\n• '+c.p+': '+c.items.join(', ')}).join('')+'\nยังไม่ตรวจ '+miss.length+' คัน'+(miss.length?': '+miss.map(function(x){return x.p}).join(', '):'');
 return{rg:rg,fl:fl,checked:checked,probs:probs,miss:miss,top:tk,pc:pc,pcount:pcount,text:tx}}
function sumView(){
 var per=S.sp||'day',u=S.su||'',c=sumCalc(per,u),units={};FLEET.forEach(function(x){if(x.br)units[x.br]=1});
 var h="<div style='display:flex;gap:6px;flex-wrap:wrap;margin:10px 0'>"+['day','week','month'].map(function(p){return"<button class='btn s"+(per==p?'':' g')+"' data-sp='"+p+"'>"+PN[p]+"</button>"}).join('')+"<select class='p glass' id='sunit'><option value=''>ทุกแผนก</option>"+Object.keys(units).sort().map(function(b){return"<option"+(b==u?' selected':'')+">"+esc(b)+"</option>"}).join('')+"</select></div>";
 h+="<div class='kg'>"+[['✅','ตรวจแล้ว',c.checked.length+'/'+c.fl.length,c.pc+'%'],['⚠','พบปัญหา',c.probs.length+' คัน',c.pcount+' รายการ'],['⏳','ยังไม่ตรวจ',c.miss.length+' คัน','']].map(function(k){return"<div class='kc'><div class='ic' style='background:var(--pub)'>"+k[0]+"</div><div class='t'>"+k[1]+"</div><b>"+k[2]+"</b><span class='sub'>"+k[3]+"</span></div>"}).join('')+"</div>";
 h+="<div class='card'><h2>ปัญหาที่พบบ่อย</h2><div class='sub'>"+(c.top.length?c.top.map(esc).join(' · '):'ไม่พบปัญหาในช่วงนี้')+"</div></div>";
 h+="<div class='card'><h2>รถที่ตรวจแล้ว ("+c.checked.length+" คัน) · "+c.rg.label+"</h2>"+(c.checked.slice(0,60).map(function(x){return"<div class='tr' style='grid-template-columns:1.3fr 1.6fr 70px'><span class='ell'><b>"+esc(x.p)+"</b><div class='sub'>"+dshort(x.last.t)+' '+hm(x.last.t)+" · "+esc(x.last.by||'-')+"</div></span><span class='ell sub'>"+(x.items.length?esc(x.items.join(', ')):'ปกติ')+"</span>"+pill(x.items.length?'พบปัญหา':'ปกติ',x.items.length?'ur':'ok')+"</div>"}).join('')||"<div class='sub'>ยังไม่มีการตรวจในช่วงนี้</div>")+"</div>";
 h+="<div class='card'><h2>ยังไม่ตรวจ ("+c.miss.length+" คัน)</h2>"+(c.miss.length?"<div style='display:flex;flex-wrap:wrap;gap:6px'>"+c.miss.map(function(x){return"<button class='pill op' style='border:0;font-family:inherit' data-pl='"+esc(x.pk)+"'>"+esc(x.p)+"</button>"}).join('')+"</div>":"<div class='sub'>ตรวจครบทุกคัน 🎉</div>")+"</div>";
 h+="<div class='card'><h2>ข้อความสรุป</h2><pre>"+esc(c.text)+"</pre><div style='display:flex;gap:8px;flex-wrap:wrap'><button class='btn s g' id='sumcopy'>คัดลอก</button><a class='btn s line' style='text-decoration:none' target='_blank' rel='noopener' href='https://line.me/R/msg/text/?"+encodeURIComponent(c.text)+"'>ส่งเข้า LINE</a><button class='btn s' id='sumsave'>บันทึกสรุปลงชีต</button></div></div>";
 return h}
function histView(){
 var m=S.hm||'sum';
 var h="<div class='hd'><div><h1>ประวัติ</h1><div class='sub'>บันทึกว่าคันไหนตรวจแล้ว ปัญหาที่เจอ และสรุป</div></div></div><div style='display:flex;gap:6px;margin-bottom:6px'><button class='btn s"+(m=='sum'?'':' g')+"' data-hm='sum'>สรุป</button><button class='btn s"+(m=='car'?'':' g')+"' data-hm='car'>รายคัน</button></div>";
 return h+(m=='sum'?sumView():plate())}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
 if(d.hm!==undefined){S.hm=d.hm;render()}
 else if(d.sp!==undefined){S.sp=d.sp;render()}
 else if(b.id=='sumcopy'){var tx=sumCalc(S.sp||'day',S.su||'').text;try{navigator.clipboard.writeText(tx).then(function(){toast('คัดลอกสรุปแล้ว')},function(){toast('คัดลอกไม่ได้ กดค้างที่ข้อความเพื่อคัดลอก')})}catch(x){toast('คัดลอกไม่ได้ กดค้างที่ข้อความเพื่อคัดลอก')}}
 else if(b.id=='sumsave'){var per=S.sp||'day',c=sumCalc(per,S.su||''),isG=!!(window.google&&google.script&&google.script.run);
  if(!isG){toast('(ตัวอย่าง) เมื่อใช้งานจริงจะบันทึกลงแท็บ “สรุปประวัติ”');return}
  b.disabled=true;google.script.run.withSuccessHandler(function(){b.disabled=false;toast('บันทึกสรุปลงชีต “สรุปประวัติ” แล้ว')}).withFailureHandler(function(e){b.disabled=false;toast((e&&e.message)||'บันทึกไม่สำเร็จ')}).apiSaveSummary({period:PN[per],label:c.rg.label,unit:S.su||'',checked:c.checked.length,total:c.fl.length,withProb:c.probs.length,probCount:c.pcount,top:c.top.join(', '),missing:c.miss.map(function(x){return x.p}).join(', '),text:c.text})}
});
document.addEventListener('change',function(e){if(e.target.id=='sunit'){S.su=e.target.value;render()}});

load();
</script>
